{% include base_path %}

<style>
  .digital-portfolio-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin: 1rem 0 2rem;
  }

  .digital-portfolio-item {
    position: relative;
    width: 220px;
    z-index: 1;
  }

  .digital-portfolio-link {
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .digital-portfolio-item img {
    display: block;
    width: 220px;
    height: 150px;
    object-fit: cover;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 4px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    background: #f8f8f8;
  }

  .digital-portfolio-item:hover {
    z-index: 2;
  }

  .digital-portfolio-item:hover img {
    transform: scale(1.04);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  }

  .digital-portfolio-label {
    display: block;
    margin-top: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
  }

  .digital-portfolio-repo {
    display: block;
    margin-top: 4px;
    font-size: 0.8rem;
    text-align: center;
    color: #555;
  }

  .digital-portfolio-tooltip {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 230px;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.2s ease;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }

  .digital-portfolio-item:hover .digital-portfolio-tooltip {
    visibility: visible;
    opacity: 1;
  }

  .digital-portfolio-tooltip-title {
    margin: 0 0 4px;
    font-family: "Roboto", Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #111;
    text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
  }

  .digital-portfolio-tooltip-desc {
    margin: 0;
    font-family: "Roboto", Arial, sans-serif;
    font-size: 12px;
    line-height: 1.35;
    color: #333;
    text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
  }
</style>

<div class="digital-portfolio-gallery">
  {% for app in site.data.digital_portfolio.apps %}
    <div class="digital-portfolio-item">
      <a class="digital-portfolio-link"
         href="{{ app.url }}"
         target="_blank"
         rel="noopener noreferrer">
        <img src="{{ app.image | prepend: base_path }}"
             alt="{{ app.title }}">
        <div class="digital-portfolio-tooltip">
          <p class="digital-portfolio-tooltip-title">{{ app.title }}</p>
          {% if app.description %}
            <p class="digital-portfolio-tooltip-desc">{{ app.description }}</p>
          {% endif %}
        </div>
      </a>
      <span class="digital-portfolio-label">{{ app.title }}</span>
      {% if app.repo %}
        <a class="digital-portfolio-repo" href="{{ app.repo }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      {% endif %}
    </div>
  {% endfor %}
</div>
