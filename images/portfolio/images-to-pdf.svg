<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" role="img" aria-label="Images to PDF - JPG to PDF">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="420" height="280" fill="url(#bg)"/>
  <rect x="16" y="16" width="388" height="248" rx="16" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>

  <g filter="url(#shadow)" transform="translate(52, 72)">
    <rect x="8" y="8" width="88" height="108" rx="8" fill="#e8edf3" stroke="#c5d0de"/>
    <rect x="0" y="0" width="88" height="108" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>
    <path d="M0 22 H88" stroke="#90a4ae" stroke-width="2"/>
    <circle cx="14" cy="11" r="4" fill="#ef5350"/>
    <circle cx="28" cy="11" r="4" fill="#ffb300"/>
    <circle cx="42" cy="11" r="4" fill="#66bb6a"/>
    <rect x="14" y="38" width="60" height="40" rx="4" fill="#a5d6a7"/>
    <circle cx="34" cy="52" r="10" fill="#81c784"/>
    <polygon points="34,44 42,60 26,60" fill="#ffffff" opacity="0.9"/>
    <text x="44" y="98" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="18" font-weight="700" fill="#2e7d32">.JPG</text>
  </g>

  <g transform="translate(210, 118)">
    <line x1="-28" y1="0" x2="18" y2="0" stroke="#546e7a" stroke-width="4" stroke-linecap="round"/>
    <polygon points="18,-10 36,0 18,10" fill="#546e7a"/>
  </g>

  <g filter="url(#shadow)" transform="translate(248, 72)">
    <rect x="0" y="0" width="88" height="108" rx="8" fill="#ffffff" stroke="#e53935" stroke-width="2"/>
    <path d="M0 22 H88" stroke="#e53935" stroke-width="2"/>
    <circle cx="14" cy="11" r="4" fill="#ef5350"/>
    <circle cx="28" cy="11" r="4" fill="#ffb300"/>
    <circle cx="42" cy="11" r="4" fill="#66bb6a"/>
    <rect x="18" y="42" width="52" height="44" rx="4" fill="#ffebee"/>
    <text x="44" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#c62828">PDF</text>
    <text x="44" y="98" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="18" font-weight="700" fill="#c62828">.PDF</text>
  </g>

  <text x="210" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#37474f">Images to PDF</text>
  <text x="210" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#78909c">Batch folder converter - Python script</text>
